$schema: 'https://moonrepo.dev/schemas/moon-project.json'

language: 'typescript'

tasks:
  dev:
    command: 'pnpm run dev'
  build:
    command: 'pnpm run build'
    inputs:
      - 'src/**'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
    outputs:
      - 'dist/**'
  test:
    command: 'pnpm run test'
    inputs:
      - 'src/**'
      - 'test/**'
  typecheck:
    command: 'pnpm run typecheck'
    inputs:
      - 'src/**'
      - 'test/**'
      - 'tsconfig.json'
