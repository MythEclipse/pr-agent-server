# nginx config for the PR Agent SPA image.
#
# These are the SAME routes apps/web/vite.config.ts proxies in development:
#   /rpc       oRPC mount
#   /api/auth  better-auth catch-all
#   /api       API paths
#
# The auth route is same-origin on purpose. better-auth's session cookie is
# first-party only, so proxying to a different ORIGIN drops it — and the app then
# signs in successfully and shows nothing but the failures of the next request.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Declared HERE, inside the server block — see the Dockerfile for why this is
  # not at http level. 00-upstream.conf supplies the resolver.
  #
  # The API hostname is resolved LAZILY. nginx resolves a literal proxy_pass host
  # at STARTUP, so with the api absent it aborts before serving a byte:
  #   nginx: [emerg] host not found in upstream "pr-agent-api"
  # That makes this image order-dependent: it only boots if the api container
  # happens to exist first, which a fresh `docker compose up` does not guarantee.
  # With a variable, DNS resolves per request and nginx always starts.
  set $api_upstream pr-agent-api:4023;

  # Headers are inlined rather than `include /etc/nginx/proxy_params`: that file
  # ships with Debian's nginx-extras and does NOT exist in the official image, so
  # including it fails startup with a message about a missing file rather than
  # about the misconfiguration.
  location /rpc/ {
    proxy_pass http://$api_upstream/rpc/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://$api_upstream/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets are immutable by name. Long cache, and skip the
  # revalidation round-trip that would otherwise hit every image request.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every unmatched path returns index.html so client-side routes
  # survive a reload. Separate from the asset rule above, which must 404 rather
  # than silently return HTML for a missing .js — that mismatch is what turns a
  # stale index.html into a blank page instead of a visible error.
  location / {
    try_files $uri $uri/ /index.html;
  }
}