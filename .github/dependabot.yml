version: 2
updates:
  # The old config pointed at `directory: "/"` with no root package.json, and
  # at three /services/* directories that have never existed here — so
  # Dependabot was silently updating nothing. It now covers the workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    labels: [dependencies]
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']