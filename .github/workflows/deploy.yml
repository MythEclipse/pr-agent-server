name: Build & Deploy

# Ships node dist/ instead of the old `bun build --compile` binary, and keeps
# the deploy mechanics that already worked: SSH, a systemd unit, and a health
# poll on :4023. The previous tree is kept as `.prev` so a bad deploy can be
# rolled back by hand.
#
# Gated on ci.yml via workflow_run, so a commit that fails lint/typecheck/tests
# cannot reach the box even if it lands on main. ci.yml re-runs its own gates
# here too: workflow_run reports the *conclusion* of the other workflow, not
# its artifacts, so the commit is re-checked from scratch before anything ships.
#
# The first Node deploy should be run with workflow_dispatch and watched.
# Add an `environment: production` to this job once that is routine — that is
# what makes the deploy wait for a human approval.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # workflow_run also fires when CI *fails*. Without this the box would be
    # updated from a commit that never passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch, not the SHA that ran.
          # Without this a second push to main would ship the newer commit
          # under the older run's green tick.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same gates ci.yml runs, so a red build never reaches the VPS.
      - name: Lint
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm -C apps/api test && pnpm -C apps/worker test

      - name: Build
        run: pnpm run build

      # ci.yml has this; a deploy without it would happily ship a schema change
      # whose migration was never committed. `node dist/migrate.js` on the box
      # would then apply a stale drizzle/ — the new tables simply would not
      # exist, and the app would fail on boot or, worse, on first login.
      #
      # `git status --porcelain`, not `git diff`: diff compares the working tree
      # to the index and never sees an untracked file.
      - name: Drizzle drift
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "::error::drizzle/ is out of date — run 'pnpm db:generate' and commit the SQL"
            git status --porcelain -- drizzle/
            exit 1
          fi

      # `pnpm deploy` writes a self-contained node_modules, so the box needs no
      # pnpm and the installed tree is exactly what CI resolved.
      #
      # Two things here are not optional:
      #   --filter  pnpm deploy selects nothing without it (`-C apps/api` changes
      #             directory but picks no project, and pnpm exits with
      #             ERR_PNPM_NOTHING_TO_DEPLOY).
      #   --legacy  pnpm 10 refuses a non-injected workspace; without this it
      #             exits with ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE.
      - name: Package the API
        run: pnpm --filter=@pr-agent/api deploy --prod --legacy /tmp/pkg-api

      - name: Add the API runtime files
        run: |
          cp -r apps/api/drizzle /tmp/pkg-api/drizzle
          cp -r apps/web/dist /tmp/pkg-api/web-dist

      - name: Package the worker
        run: |
          mkdir -p /tmp/pkg-worker
          cp -r apps/worker/dist /tmp/pkg-worker/dist
          cp apps/worker/package.json /tmp/pkg-worker/package.json
          cp apps/worker/run-worker.sh /tmp/pkg-worker/run-worker.sh
          chmod +x /tmp/pkg-worker/run-worker.sh

      - name: Archive
        # tar, not `cp -r`. The deployed node_modules is 476 symlinks pointing
        # into node_modules/.pnpm; a plain copy dereferences them and turns a
        # 202M tree into 838M on the wire while destroying the store layout.
        run: |
          tar -czf /tmp/pkg-api.tar.gz -C /tmp/pkg-api .
          tar -czf /tmp/pkg-worker.tar.gz -C /tmp/pkg-worker .

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp /tmp/pkg-api.tar.gz "$VPS_USER@$VPS_HOST:/tmp/pkg-api.tar.gz"
          scp /tmp/pkg-worker.tar.gz "$VPS_USER@$VPS_HOST:/tmp/pkg-worker.tar.gz"
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -euo pipefail

          # --- the webhook server -------------------------------------------
          cd /opt/pr-agent-server
          rm -rf .prev && mkdir -p .prev
          for item in dist node_modules drizzle web-dist package.json; do
            [ -e "$item" ] && cp -a "$item" .prev/ || true
          done
          rm -rf dist node_modules drizzle web-dist package.json
          mkdir -p /tmp/pkg-api.new
          tar -xzf /tmp/pkg-api.tar.gz -C /tmp/pkg-api.new
          for item in dist node_modules drizzle web-dist package.json; do
            mv "/tmp/pkg-api.new/$item" ./"$item"
          done
          chmod -R a+rX /opt/pr-agent-server
          rm -rf /tmp/pkg-api.new /tmp/pkg-api.tar.gz

          # Migrations run as their own step, decoupled from application boot,
          # so a schema rollback and a code rollback stay independent.
          /opt/node/bin/node /opt/pr-agent-server/dist/migrate.js

          systemctl restart pr-agent-server.service

          # --- the PR worker -------------------------------------------------
          cd /opt/pr-agent-worker
          rm -rf dist package.json run-worker.sh
          mkdir -p /tmp/pkg-worker.new
          tar -xzf /tmp/pkg-worker.tar.gz -C /tmp/pkg-worker.new
          for item in dist package.json run-worker.sh; do
            mv "/tmp/pkg-worker.new/$item" ./"$item"
          done
          chmod +x /opt/pr-agent-worker/run-worker.sh
          rm -rf /tmp/pkg-worker.new /tmp/pkg-worker.tar.gz

          systemctl restart pr-agent-worker.timer
          systemctl restart pr-agent-sync-hooks.timer
          REMOTE

      # Same poll the old workflow used, on the same port: the health watchdog
      # and the systemd unit both expect :4023/health.
      - name: Wait for health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh "$VPS_USER@$VPS_HOST" "curl -fsS -m 2 http://127.0.0.1:4023/health" 2>/dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::service did not become healthy; diagnostics follow"
          ssh "$VPS_USER@$VPS_HOST" 'systemctl is-active pr-agent-server.service || true; ss -ltnp | grep -E ":(4023|3000)" || true; systemctl show -p Environment -p MainPID -p ExecMainStatus pr-agent-server.service || true; journalctl -u pr-agent-server.service -n 60 || true'
          exit 1

  cleanup:
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reap leftover Nix store entries
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          # Non-fatal: the runtime no longer depends on Nix.
          ssh "$VPS_USER@$VPS_HOST" 'sudo /usr/local/bin/nix-gc-vps.sh' || true