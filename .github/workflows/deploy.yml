name: Build & Deploy

# Ships node dist/ instead of the old `bun build --compile` binary, and keeps
# the deploy mechanics that already worked: SSH, a systemd unit, and a health
# poll on :4023. The previous tree is kept as `.prev` so a bad deploy can be
# rolled back by hand.
#
# Gated on ci.yml via workflow_run, so a commit that fails lint/typecheck/tests
# cannot reach the box even if it lands on main. ci.yml re-runs its own gates
# here too: workflow_run reports the *conclusion* of the other workflow, not
# its artifacts, so the commit is re-checked from scratch before anything ships.
#
# The first Node deploy should be run with workflow_dispatch and watched.
# Add an `environment: production` to this job once that is routine — that is
# what makes the deploy wait for a human approval.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # workflow_run also fires when CI *fails*. Without this the box would be
    # updated from a commit that never passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch, not the SHA that ran.
          # Without this a second push to main would ship the newer commit
          # under the older run's green tick.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same reason as the step in ci.yml: the Typecheck and Build steps below
      # are root scripts, so they resolve `moon` from node_modules/.bin.
      - name: Verify moon is on PATH
        run: pnpm exec moon --version

      # The same gates ci.yml runs, so a red build never reaches the VPS.
      - name: Lint
        run: pnpm exec biome check .

      # No explicit route-tree step here on purpose: apps/web's `typecheck`
      # script is `tsr generate && tsc --noEmit`, so the generated, gitignored
      # route tree exists before tsc runs. See the Typecheck step in ci.yml.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm -C apps/api test && pnpm -C apps/worker test

      - name: Build
        run: pnpm run build

      # ci.yml has this; a deploy without it would happily ship a schema change
      # whose migration was never committed. `node dist/migrate.js` on the box
      # would then apply a stale drizzle/ — the new tables simply would not
      # exist, and the app would fail on boot or, worse, on first login.
      #
      # `git status --porcelain`, not `git diff`: diff compares the working tree
      # to the index and never sees an untracked file.
      - name: Drizzle drift
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "::error::drizzle/ is out of date — run 'pnpm db:generate' and commit the SQL"
            git status --porcelain -- drizzle/
            exit 1
          fi

      # `pnpm deploy` writes a self-contained node_modules, so the box needs no
      # pnpm and the installed tree is exactly what CI resolved.
      #
      # Two things here are not optional:
      #   --filter  pnpm deploy selects nothing without it (`-C apps/api` changes
      #             directory but picks no project, and pnpm exits with
      #             ERR_PNPM_NOTHING_TO_DEPLOY).
      #   --legacy  pnpm 10 refuses a non-injected workspace; without this it
      #             exits with ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE.
      - name: Package the API
        run: pnpm --filter=@pr-agent/api deploy --prod --legacy /tmp/pkg-api

      # The unit travels with the packages. It was committed to the repo in 8fe99de
      # but never shipped, which is why the box was still running
      # pr-agent-bun.service while the deploy restarted a name systemd had never
      # heard of.
      - name: Add the API runtime files
        run: |
          cp -r apps/api/drizzle /tmp/pkg-api/drizzle
          cp -r apps/web/dist /tmp/pkg-api/web-dist
          cp deploy/pr-agent-server.service /tmp/pkg-pr-agent-server.service

      - name: Package the worker
        run: |
          mkdir -p /tmp/pkg-worker
          cp -r apps/worker/dist /tmp/pkg-worker/dist
          cp apps/worker/package.json /tmp/pkg-worker/package.json
          cp apps/worker/run-worker.sh /tmp/pkg-worker/run-worker.sh
          chmod +x /tmp/pkg-worker/run-worker.sh

      - name: Archive
        # tar, not `cp -r`. The deployed node_modules is 476 symlinks pointing
        # into node_modules/.pnpm; a plain copy dereferences them and turns a
        # 202M tree into 838M on the wire while destroying the store layout.
        run: |
          tar -czf /tmp/pkg-api.tar.gz -C /tmp/pkg-api .
          tar -czf /tmp/pkg-worker.tar.gz -C /tmp/pkg-worker .

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

      # `accept-new` on every call below, not just the ssh heredoc: a fresh
      # runner has an empty known_hosts, so the first connection to the box is
      # unverifiable and scp dies with "Host key verification failed". Only the
      # heredoc ssh carried the flag, so the two scps ahead of it failed first.
      #
      # `accept-new`, not `no`: the first connection is recorded, so a host key
      # that later CHANGES still fails loudly instead of being silently accepted.
      # Everything in the heredoc below runs under sudo. Two independent
      # reasons, both observed on the box:
      #   1. /opt/pr-agent-server is root:root, so the unprivileged deploy user
      #      cannot create .prev in it — that was the "mkdir: Permission denied"
      #      that stopped the deploy. /opt/pr-agent-worker is pr-agent-owned and
      #      is NOT sudo'd: the worker half must keep working for the plain user.
      #   2. systemctl restart and daemon-reload need root regardless.
      #
      # `sudo -n` throughout: a password prompt in a non-tty heredoc would hang
      # until the step timed out rather than failing fast.
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -o StrictHostKeyChecking=accept-new /tmp/pkg-api.tar.gz "$VPS_USER@$VPS_HOST:/tmp/pkg-api.tar.gz"
          scp -o StrictHostKeyChecking=accept-new /tmp/pkg-worker.tar.gz "$VPS_USER@$VPS_HOST:/tmp/pkg-worker.tar.gz"
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -euo pipefail

          # --- node, for both halves ----------------------------------------
          # The Node migration commit (8fe99de) assumed node already lived at
          # /opt/node; nothing ever installed it and the box had none, so both
          # `/opt/node/bin/node dist/migrate.js` and the unit's ExecStart would
          # fail with "No such file or directory".
          #
          # Under /opt, not a user home: the pr-agent user cannot read /home/code
          # (mode 750), which apps/worker/run-worker.sh also calls out.
          NODE_VERSION=24.21.0
          if [ ! -x /opt/node/bin/node ]; then
            arch=$(uname -m)
            case "$arch" in
              x86_64) node_arch=x64 ;;
              aarch64) node_arch=arm64 ;;
              *) echo "unsupported arch: $arch" >&2; exit 1 ;;
            esac
            echo "installing node $NODE_VERSION ($node_arch) to /opt/node"
            curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-$node_arch.tar.xz" \
              | sudo -n tar -xJ -C /opt
            sudo -n ln -sfn "/opt/node-v$NODE_VERSION-linux-$node_arch" /opt/node
          fi
          /opt/node/bin/node --version

          # --- the webhook server -------------------------------------------
          cd /opt/pr-agent-server
          sudo -n rm -rf .prev
          sudo -n mkdir -p .prev
          for item in dist node_modules drizzle web-dist package.json; do
            [ -e "$item" ] && sudo -n cp -a "$item" .prev/ || true
          done
          sudo -n rm -rf dist node_modules drizzle web-dist package.json
          mkdir -p /tmp/pkg-api.new
          tar -xzf /tmp/pkg-api.tar.gz -C /tmp/pkg-api.new
          for item in dist node_modules drizzle web-dist package.json; do
            sudo -n mv "/tmp/pkg-api.new/$item" ./"$item"
          done
          sudo -n chmod -R a+rX /opt/pr-agent-server
          rm -rf /tmp/pkg-api.new /tmp/pkg-api.tar.gz

          # Migrations run as their own step, decoupled from application boot,
          # so a schema rollback and a code rollback stay independent.
          #
          # This is the step that first needs DATABASE_URL, and it is required
          # with no default (apps/api/src/infrastructure/config/env.ts). It is
          # NOT in the Bitwarden `pr-agent` project yet, so as of this writing
          # this line exits non-zero — checked on the box, the vault holds
          # neither DATABASE_URL nor BETTER_AUTH_SECRET. The explicit check
          # below turns that into a named error instead of a zod stack trace.
          #
          # Migrate BEFORE the restart: a schema the new code needs but the old
          # code lacks would take the server down on boot.
          if [ -z "${DATABASE_URL:-}" ] && ! sudo -n -u pr-agent /usr/local/bin/bws-exec pr-agent printenv DATABASE_URL >/dev/null 2>&1; then
            echo "::error::DATABASE_URL is not available to bws-exec pr-agent. migrate.js requires it and cannot run without it. Add it to the Bitwarden 'pr-agent' project before deploying the Node server."
            exit 1
          fi
          /opt/node/bin/node /opt/pr-agent-server/dist/migrate.js

          # --- the unit ------------------------------------------------------
          # Nothing in git history ever installed the unit (8fe99de shipped
          # restart calls for a unit that was never placed on the box), so
          # `systemctl restart` was a no-op against a missing unit and the
          # running server was pr-agent-bun.service all along.
          #
          # Installed only when the file exists in the repo, and always
          # daemon-reload'd, so an edited unit actually takes effect.
          if [ -f /tmp/pkg-pr-agent-server.service ]; then
            sudo -n install -m 644 /tmp/pkg-pr-agent-server.service \
              /etc/systemd/system/pr-agent-server.service
            sudo -n systemctl daemon-reload
          fi

          # Restart only if the unit is actually present. Restarting a name
          # systemd does not know fails the step, and — more importantly — this
          # must not pretend to have replaced the live server when it has not.
          if sudo -n systemctl cat pr-agent-server.service >/dev/null 2>&1; then
            sudo -n systemctl restart pr-agent-server.service
          else
            echo "::warning::pr-agent-server.service is not installed on this box; the server half was NOT restarted. Whatever is serving :4023 is unchanged."
          fi

          # --- the PR worker -------------------------------------------------
          # Deliberately NOT sudo'd: /opt/pr-agent-worker is pr-agent-owned and
          # the unprivileged deploy user writes it directly.
          cd /opt/pr-agent-worker
          rm -rf dist package.json run-worker.sh
          mkdir -p /tmp/pkg-worker.new
          tar -xzf /tmp/pkg-worker.tar.gz -C /tmp/pkg-worker.new
          for item in dist package.json run-worker.sh; do
            mv "/tmp/pkg-worker.new/$item" ./"$item"
          done
          chmod +x /opt/pr-agent-worker/run-worker.sh
          rm -rf /tmp/pkg-worker.new /tmp/pkg-worker.tar.gz

          sudo -n systemctl restart pr-agent-worker.timer
          sudo -n systemctl restart pr-agent-sync-hooks.timer
          REMOTE

      # Same poll the old workflow used, on the same port: the health watchdog
      # and the systemd unit both expect :4023/health.
      - name: Wait for health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # :4023 stays the probe — the health watchdog depends on it — but it
          # does NOT prove the Node deploy landed. On this box something else
          # (pr-agent-bun.service) already answered that port, so a green poll
          # only ever meant "something answers", not "the new code serves".
          # `systemctl is-active pr-agent-server.service` is the check that
          # actually distinguishes the two.
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "curl -fsS -m 2 http://127.0.0.1:4023/health" 2>/dev/null; then
              echo "healthy after ${i}s"
              break
            fi
            sleep 1
          done

          # Report which process owns the port, so the log says which server is
          # actually serving rather than leaving it ambiguous.
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" 'echo "--- pr-agent-server.service: $(systemctl is-active pr-agent-server.service 2>&1)"; echo "--- pr-agent-bun.service:    $(systemctl is-active pr-agent-bun.service 2>&1)"; echo "--- :4023 owner:"; sudo -n ss -ltnp 2>/dev/null | grep ":4023" || true' || true

          # The cutover only counts as done when the Node unit is the one
          # serving. If it is not, that is a real failure — silently passing
          # here is what let the Bun/Node split go unnoticed.
          if ! ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "systemctl is-active --quiet pr-agent-server.service"; then
            echo "::error::pr-agent-server.service is not active — the Node server did not take over :4023 (see which unit owns it above). The previously running server was left untouched."
            ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" 'systemctl is-active pr-agent-server.service || true; ss -ltnp | grep -E ":(4023|3000)" || true; systemctl show -p Environment -p MainPID -p ExecMainStatus pr-agent-server.service || true; journalctl -u pr-agent-server.service -n 60 || true' || true
            exit 1
          fi
          echo "pr-agent-server.service is active and serving :4023"

  cleanup:
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reap leftover Nix store entries
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          # Non-fatal: the runtime no longer depends on Nix.
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" 'sudo /usr/local/bin/nix-gc-vps.sh' || true
