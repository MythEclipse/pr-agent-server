name: CI

# The old workflow only ran on push to main, which meant a PR was never
# validated before it landed. This one gates every PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — moon is a VCS-aware task runner and needs real history.
      #
      # On a pull_request event checkout fetches a single merge commit at depth
      # 1, so the `main` branch ref never exists locally. moon then diffs
      # against vcs.defaultBranch ('main' in .moon/workspace.yml) and dies with
      # `fatal: ambiguous argument 'main': unknown revision`, exit 128 —
      # killing the Typecheck step on every PR.
      #
      # Push runs were unaffected because `main` IS the checked-out branch
      # there, which is why every green run so far was a push and the PR gate
      # stayed red. deploy.yml already sets this for the same reason.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nothing else here installs moon, and the root package.json scripts are
      # all `moon run :…` — so without this the Typecheck step below died on
      # `sh: 1: moon: not found`. It is a pinned devDependency rather than an
      # action, so `pnpm install` puts it in node_modules/.bin and the lockfile
      # pins its version like every other dependency.
      #
      # `pnpm exec`, not a bare `moon`: a `run:` step gets a plain shell, and only
      # pnpm prepends node_modules/.bin to PATH. A bare `moon --version` here
      # exits 127 and the step fails for the wrong reason.
      - name: Verify moon is on PATH
        run: pnpm exec moon --version

      - name: Lint and format
        run: pnpm exec biome check .

      # No explicit route-tree step here on purpose: apps/web's `typecheck`
      # script is `tsr generate && tsc --noEmit`, because ./routeTree.gen.ts is
      # generated and gitignored (.gitignore:43). Only the TanStack Router vite
      # plugin used to produce it, and that runs during build/dev — after this
      # step — so on a fresh clone tsc failed with TS2307 on ./routeTree.gen.ts
      # plus six follow-on TS2345 errors.
      #
      # Generating it in the script rather than in a workflow step keeps a fresh
      # local clone working too: `pnpm -C apps/web typecheck` and `moon run
      # :typecheck` both self-heal without anyone remembering a codegen step.
      #
      # The file stays gitignored, which is also why lint above skips it:
      # biome.json sets vcs.useIgnoreFile, so biome honours the ignore list.
      # Committing it instead would fail lint — biome would want to format and
      # re-sort a file the plugin rewrites unformatted on every build.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm -C apps/api test && pnpm -C apps/worker test

      - name: Build
        run: pnpm run build

      # CI enforces no drift: a schema change without a committed migration
      # fails here rather than at deploy time (skill §5).
      #
      # `git status --porcelain`, not `git diff`: diff only compares the working
      # tree to the index, so a generated migration that was never `git add`ed
      # would pass the check while the deploy ran against a schema missing it.
      # That is not hypothetical — the better-auth tables went missing from the
      # migrations this way once already.
      - name: Drizzle drift
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "::error::drizzle/ is out of date — run 'pnpm db:generate' and commit the SQL"
            git status --porcelain -- drizzle/
            git diff --stat -- drizzle/
            exit 1
          fi