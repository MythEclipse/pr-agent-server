name: CI

# The old workflow only ran on push to main, which meant a PR was never
# validated before it landed. This one gates every PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm -C apps/api test && pnpm -C apps/worker test

      - name: Build
        run: pnpm run build

      # CI enforces no drift: a schema change without a committed migration
      # fails here rather than at deploy time (skill §5).
      #
      # `git status --porcelain`, not `git diff`: diff only compares the working
      # tree to the index, so a generated migration that was never `git add`ed
      # would pass the check while the deploy ran against a schema missing it.
      # That is not hypothetical — the better-auth tables went missing from the
      # migrations this way once already.
      - name: Drizzle drift
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "::error::drizzle/ is out of date — run 'pnpm db:generate' and commit the SQL"
            git status --porcelain -- drizzle/
            git diff --stat -- drizzle/
            exit 1
          fi