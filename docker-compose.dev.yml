# Local dev database. Postgres only — the review queue is DB-backed (P3) and
# nothing else needs a cache, so Redis is deliberately absent.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pr-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pr_agent
      POSTGRES_PASSWORD: pr_agent_dev
      POSTGRES_DB: pr_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_agent -d pr_agent_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
